services:
  - type: web
    name: vinscope-kenya-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vinscope-postgres
          property: connectionString

databases:
  - name: vinscope-postgres
    plan: free
    databaseName: vinscope
    user: vinscope
