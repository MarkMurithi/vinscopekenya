<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
  <title id="title">Nairobi inspired backdrop fallback</title>
  <desc id="desc">Blue dusk city skyline with warm lights and subtle cloud gradients.</desc>
  <defs>
